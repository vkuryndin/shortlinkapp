name: SBOM + Dependency Scan

on:
  pull_request:
  workflow_dispatch:
    inputs:
      projectName:
        description: "Dependency-Track project name (default: repo name)"
        required: false
      projectVersion:
        description: "Dependency-Track project version (default: branch name)"
        required: false
      runDependencyCheck:
        description: "Run OWASP Dependency-Check (true/false)"
        required: false
        default: "true"
      uploadToDependencyTrack:
        description: "Upload SBOM to Dependency-Track (true/false)"
        required: false
        default: "true"

permissions:
  contents: read

env:
  SBOM_XML: build/reports/bom.xml

jobs:
  build_sbom:
    name: build (Generate SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate CycloneDX SBOM
        run: ./gradlew --no-daemon cyclonedxBom

      - name: Verify SBOM exists
        run: |
          if [ ! -f "${SBOM_XML}" ]; then
            echo "SBOM not found at ${SBOM_XML}"
            echo "Listing build/reports:"
            find build/reports -maxdepth 3 -type f -print
            exit 1
          fi

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: build/reports/bom.*
          retention-days: 7

  dependency_check:
    name: security (Dependency-Check)
    runs-on: ubuntu-latest
    needs: build_sbom
    if: ${{ github.event_name == 'pull_request' || github.event.inputs.runDependencyCheck == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew --no-daemon dependencyCheckAnalyze

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/
          retention-days: 7

  upload_to_dependencytrack:
    name: security (Upload SBOM to Dependency-Track)
    needs: build_sbom
    if: ${{ github.event_name == 'pull_request' || github.event.inputs.uploadToDependencyTrack == 'true' }}
    runs-on: [ self-hosted, dtrack ]
    steps:
      - uses: actions/checkout@v4

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-cyclonedx
          path: build/reports

      - name: Upload SBOM and export findings from Dependency-Track
        env:
          DTRACK_URL: ${{ secrets.DTRACK_URL }}
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
        run: |
          set -euo pipefail

          PROJECT_NAME_INPUT="${{ github.event.inputs.projectName }}"
          PROJECT_VERSION_INPUT="${{ github.event.inputs.projectVersion }}"

          if [ -n "${PROJECT_NAME_INPUT}" ]; then
            PROJECT_NAME="${PROJECT_NAME_INPUT}"
          else
            PROJECT_NAME="${{ github.event.repository.name }}"
          fi

          if [ -n "${PROJECT_VERSION_INPUT}" ]; then
            PROJECT_VERSION="${PROJECT_VERSION_INPUT}"
          else
            PROJECT_VERSION="${{ github.head_ref || github.ref_name }}"
          fi

          test -f "${SBOM_XML}"

          # 1) Upload BOM -> get processing token
          echo "Uploading BOM for ${PROJECT_NAME}@${PROJECT_VERSION} to ${DTRACK_URL}"
          TOKEN="$(curl -sS -X POST "${DTRACK_URL}/api/v1/bom" \
            -H "X-Api-Key: ${DTRACK_API_KEY}" \
            -F "projectName=${PROJECT_NAME}" \
            -F "projectVersion=${PROJECT_VERSION}" \
            -F "autoCreate=true" \
            -F "bom=@${SBOM_XML}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')"

          echo "{\"token\":\"${TOKEN}\"}" > dtrack-upload.json
          echo "BOM token: ${TOKEN}"

          # 2) Wait until processing is done (max ~5 min)
          for i in {1..60}; do
            STATUS="$(curl -sS -H "X-Api-Key: ${DTRACK_API_KEY}" \
              "${DTRACK_URL}/api/v1/bom/token/${TOKEN}")"
            echo "token status: ${STATUS}"
            echo "${STATUS}" | grep -q '"processing":false' && break
            sleep 5
          done

          # 3) Lookup project UUID
          PROJECT_UUID="$(curl -sS -G "${DTRACK_URL}/api/v1/project/lookup" \
            -H "X-Api-Key: ${DTRACK_API_KEY}" \
            --data-urlencode "name=${PROJECT_NAME}" \
            --data-urlencode "version=${PROJECT_VERSION}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["uuid"])')"

          echo "Project UUID: ${PROJECT_UUID}"

          # 4) Export findings + vulnerabilities (две разные выборки)
          curl -sS -H "X-Api-Key: ${DTRACK_API_KEY}" \
            "${DTRACK_URL}/api/v1/finding/project/${PROJECT_UUID}" \
            -o dtrack-findings.json

          curl -sS -H "X-Api-Key: ${DTRACK_API_KEY}" \
            "${DTRACK_URL}/api/v1/vulnerability/project/${PROJECT_UUID}" \
            -o dtrack-vulnerabilities.json

          # Small sanity output
          echo "findings bytes: $(stat -c%s dtrack-findings.json || true)"
          echo "vulns bytes: $(stat -c%s dtrack-vulnerabilities.json || true)"

      - name: Upload Dependency-Track results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-track-results
          path: |
            dtrack-upload.json
            dtrack-findings.json
            dtrack-vulnerabilities.json
          retention-days: 7
